<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroomin - Camera access</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        color: light-dark(#16172b, #f1f2fb);
        background: light-dark(#ffffff, #0f1018);
      }
      main { max-width: 420px; padding: 24px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.01em; }
      p { margin: 0 0 16px; line-height: 1.5; color: light-dark(#4b4d68, #a6a9c6); }
      button {
        padding: 9px 16px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        color: light-dark(#ffffff, #0f1018);
        background: light-dark(#4f46e5, #818cf8);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Allow camera access</h1>
      <p id="status">Scroomin needs your camera to detect when you look away. Click "Allow" in the browser prompt at the top-left.</p>
      <button id="retry" type="button">Request access again</button>
    </main>
    <script type="module" src="./permission.ts"></script>
  </body>
</html>
